name: Publish F5AuditDNS to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected = f"v{project['version']}"
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match {expected!r}")
          print(f"Verified {project['name']} {expected}")
          PYCODE
      - name: Install tools and test dependencies
        run: python -m pip install --upgrade "build" "twine" ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: f5auditdns-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (Trusted Publishing)
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/f5auditdns/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: f5auditdns-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
